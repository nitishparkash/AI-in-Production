version: "3.9"

services:
  aavail-api:
    build: .
    container_name: aavail-revenue-api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./eda_outputs:/app/eda_outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
